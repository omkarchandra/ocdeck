[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ocdeck"
version = "0.1.0"
description = "A terminal operations console for AI coding agents (OpenCode, Claude Code, Codex)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "OC Deck contributors"}]
keywords = ["opencode", "claude-code", "codex", "tmux", "dashboard", "tui", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
requires-python = ">=3.12"
dependencies = [
  "textual==8.2.8",
]

[project.optional-dependencies]
dev = ["pytest", "websocket-client==1.9.0"]

[project.urls]
Homepage = "https://github.com/omkarchandra/ocdeck"
Issues = "https://github.com/omkarchandra/ocdeck/issues"

[project.scripts]
ocdeck = "ocdeck.cli:main"
oc_agent_web = "ocdeck.browser_cli:main"
ocdeck-hub = "ocdeck.hub:main"
ocdeck-index = "ocdeck.index_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
